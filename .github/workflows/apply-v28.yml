name: Apply V28 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v28.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V28 patch
        run: |
          git apply --check v28_final.patch
          git apply v28_final.patch
      - name: Commit V28 final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm v28_final.patch .github/workflows/apply-v28.yml
          git commit -m "Apply V28 final dashboard refit"
          git push origin main
