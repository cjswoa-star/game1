<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
body{background:#f4efe5;display:flex;justify-content:center;align-items:flex-start;padding:0}
.hidden{display:none!important}
button,input{font:inherit} button{cursor:pointer}
.student-stage{width:min(100%,430px);margin:0 auto;min-height:100vh;background:#f4efe5}
.student-screen{position:relative;width:100%;aspect-ratio:852/1846;overflow:hidden;background:#fffaf0}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
.overlay-field,.overlay-button,.game-round-title,.game-name,.dynamic-score,.round-result-title,.round-result-score,.result-name,.result-score-row,.result-final-value,.final-meta,.send-state,.copy-link,.linked-room{position:absolute;z-index:4;left:27%;top:72.45%;width:46%;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.74);backdrop-filter:blur(3px);text-align:center;font-weight:900;font-size:clamp(11px,2.8vw,14px);color:#7f6f61}
.overlay-field input{width:100%;height:100%;border:0;outline:none;background:transparent;color:#72685f;text-align:center;font-weight:900;font-size:clamp(16px,4.6vw,22px)}
.overlay-field input::placeholder{color:rgba(116,109,101,.45)}

/* start */
.room-field{position:absolute;z-index:3;left:13.2%;top:72.25%;width:73.6%;height:4.55%}
.slot-capture{position:absolute;inset:0;opacity:.01;z-index:3}
.code-slots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2.3%}

.linked-room{left:28%;top:72.9%;width:44%;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.76);backdrop-filter:blur(3px);text-align:center;font-weight:900;font-size:clamp(11px,2.8vw,14px);color:#7f6f61}

.start-button{left:17.0%;top:85.45%;width:66%;height:6.15%;border:0;border-radius:999px;background:transparent;color:#ffffff;font-weight:1000;font-size:clamp(23px,5.9vw,31px);text-shadow:0 2px 0 rgba(121,72,73,.16)}

/* game */

.dynamic-score span{font-size:clamp(60px,18vw,96px)}
.dynamic-score small{font-size:clamp(26px,7vw,38px);color:#3f3936;margin-left:4px}
.stop-button{left:11.5%;top:62.0%;width:77%;height:11.0%;border:0;border-radius:999px;background:transparent;color:#ffffff;font-weight:1000;font-size:clamp(28px,7vw,38px);text-shadow:0 2px 0 rgba(121,72,73,.16)}
.stop-button:disabled{opacity:.65}
.meter{position:absolute;opacity:0;pointer-events:none}
.mini-row{position:absolute;z-index:3;left:10.5%;top:75.0%;width:79%;height:8.8%;display:grid!important;grid-template-columns:repeat(3,1fr);gap:4.5%}
.mini{position:relative;text-align:center;background:transparent;border:0;padding:0}
.mini span{position:absolute;left:0;top:0;width:100%;height:34%;display:flex;align-items:center;justify-content:center;color:#5f554e;font-size:clamp(11px,3.2vw,15px);font-weight:1000}
.mini strong{position:absolute;left:0;top:36%;width:100%;height:64%;display:flex;align-items:center;justify-content:center;color:#4b443e;font-size:clamp(18px,5vw,25px);font-weight:1000}

/* round result */
.round-result-title{position:absolute;z-index:4;left:13%;top:11.4%;width:74%;height:9.2%;display:flex;align-items:center;justify-content:center;text-align:center;background:transparent;font-weight:1000;font-size:clamp(23px,6.2vw,34px);color:#453d37}
.round-result-score{position:absolute;z-index:4;left:20%;top:27.5%;width:60%;height:17%;display:flex;align-items:center;justify-content:center;background:transparent;font-size:clamp(66px,19vw,104px);font-weight:1000;color:#ef727b;text-shadow:2px 2px 0 rgba(90,72,55,.10)}

.round-result-score{font-size:clamp(78px,22vw,118px)}
.next-button{left:14%;top:78.55%;width:72%;height:7.9%;background:transparent;color:white;font-size:clamp(22px,6vw,32px);box-shadow:none}

/* final result */
.result-name{display:none!important}
.result-score-row{width:28%;text-align:center;font-weight:1000;font-size:clamp(26px,7vw,38px);color:#34302d}
.result-r1{left:33%;top:45.8%}
.result-r2{left:33%;top:51.0%}
.result-r3{left:33%;top:56.2%}
.result-final-value{left:37%;top:60.0%;width:38%;height:9.5%;display:flex;align-items:center;justify-content:center;gap:3px;font-weight:1000;letter-spacing:-.05em;color:#ef7882}
.result-final-value b{font-size:clamp(64px,18vw,98px)}
.result-final-value span{font-size:clamp(32px,8vw,44px);color:#3b3532}
#gradeText{position:absolute;z-index:4;left:13%;top:11.0%;width:74%;text-align:center;font-size:clamp(21px,5.5vw,30px);font-weight:1000;color:#4b423e;line-height:1.15}
.final-meta{left:15%;top:18.5%;width:70%;text-align:center;font-size:clamp(13px,3.6vw,18px);font-weight:900;color:#6b615a;line-height:1.35}
.send-state{display:none!important}
.send-button{left:10.5%;top:74.4%;width:79%;height:7.8%;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:1000;font-size:clamp(21px,5.8vw,30px)}
.again-button{left:16.3%;top:83.0%;width:67.4%;height:5.9%;border:0;border-radius:999px;background:transparent;color:#82a0a4;font-weight:1000;font-size:clamp(18px,4.8vw,26px)}
.copy-link{display:none!important}

/* send complete */
.home-button{position:absolute;left:12.5%;top:78.0%;width:75%;height:7.9%;z-index:3;border:0;border-radius:999px;background:transparent;color:#fff;font-size:clamp(24px,6.2vw,32px);font-weight:1000}

/* toast/countdown */
.toast{position:fixed;left:50%;bottom:22px;z-index:200;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:#4c4540;color:#fffaf0;font-weight:900;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.16);white-space:nowrap}
.toast.show{opacity:1}
.countdown{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(255,248,235,.91);backdrop-filter:blur(5px);font-size:min(30vw,140px);font-weight:1000;color:#ef747d;text-shadow:4px 4px 0 #ffe29a}

/* teacher stable mode */
body.teacher-mode{padding:18px;background:#f7f1e6}
.teacher-app{width:min(1180px,100%);margin:0 auto;position:relative}
.teacher-shell{position:relative;overflow:hidden;border-radius:34px;background:rgba(255,251,241,.97);box-shadow:0 20px 50px rgba(83,65,46,.18);border:2px solid rgba(98,174,150,.22);padding:26px}
.teacher-shell::before{content:"";position:absolute;inset:0;background:url('assets/06_teacher_dashboard.png') center/cover no-repeat;opacity:.11;pointer-events:none}
.teacher-content{position:relative;z-index:2}
.teacher-hero{min-height:150px;border-radius:24px;padding:22px 25px;background:linear-gradient(90deg,rgba(255,250,238,.96),rgba(255,250,238,.78));border:2px solid rgba(105,191,168,.22);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.teacher-title .eyebrow{font-weight:900;color:#5ca78f;font-size:14px}
.teacher-title h1{margin:4px 0 8px;font-size:38px;line-height:1.06}
.teacher-title p{margin:0;color:#6e665f;font-weight:700}
.teacher-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.teacher-controls .field{min-width:190px}
.teacher-controls label{display:block;margin:0 0 6px;font-size:13px;font-weight:900;color:#7b7168}
.teacher-controls input{height:46px;padding:0 14px;border:2px solid rgba(115,187,165,.35);border-radius:14px;background:rgba(255,255,255,.88);font-weight:900}
.teacher-controls button,.teacher-footer button{height:46px;padding:0 18px;border:0;border-radius:14px;font-weight:1000;color:#fff;background:#71c8a7;box-shadow:0 8px 20px rgba(80,143,116,.18)}
.teacher-controls button.secondary,.teacher-footer button.secondary{background:#78bff1}
.teacher-footer button.danger{background:#ec8489}
.connection{margin:14px 0 12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid rgba(98,174,150,.18);font-weight:800;color:#6d625a}
.connection.good{color:#3e8f70} .connection.warn{color:#b26a47}
.share-box{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.78);border:1px dashed rgba(98,174,150,.35);font-weight:800;color:#635a53;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.stat{padding:18px 16px;border-radius:22px;background:rgba(255,255,255,.82);border:1px solid rgba(98,174,150,.18);text-align:center}
.stat span{display:block;font-size:13px;font-weight:900;color:#83776e} .stat strong{display:block;margin-top:6px;font-size:34px;font-weight:1000;color:#3f3833}
.teacher-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.panel{padding:18px;border-radius:24px;background:rgba(255,255,255,.84);border:1px solid rgba(98,174,150,.18);min-height:220px}
.panel h2{margin:0 0 14px;font-size:22px}
.teacher-table-wrap{overflow:auto;max-height:430px}
#resultTable{width:100%;border-collapse:collapse;font-size:14px}
#resultTable th,#resultTable td{padding:10px 8px;border-bottom:1px solid rgba(0,0,0,.07);text-align:left;white-space:nowrap}
#resultTable th{font-size:12px;color:#7b7269;text-transform:none}
#resultTable td.rank{font-weight:1000;color:#ef7680}
.empty-state{padding:20px;text-align:center;color:#867a70;font-weight:800}
.dist-wrap{height:100%;display:flex;align-items:flex-end;gap:14px;min-height:220px;padding:10px 8px 0}
.dist-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.dist-count{font-weight:1000;color:#4a433d}
.dist-bar{width:100%;max-width:56px;height:10px;border-radius:16px;background:linear-gradient(180deg,#a6daf7,#8ed0b4);align-self:center;transition:height .2s ease}
.dist-label{font-size:12px;color:#7e756d;font-weight:900;text-align:center}
.teacher-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.teacher-note{margin-top:12px;font-size:12px;color:#8e847a;text-align:right;font-weight:700}
@media (max-width:900px){
  .teacher-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:480px){
  .teacher-shell{padding:16px;border-radius:24px}
  .teacher-title h1{font-size:30px}
  .stats{grid-template-columns:1fr 1fr}
  .teacher-controls{width:100%}
  .teacher-controls .field,.teacher-controls input{width:100%}
  .teacher-controls button{flex:1}
}


/* =========================================================
   V6 SEAMLESS PLATE CALIBRATION
   - 배경 그림 자체가 UI 표면이 되도록 모든 동적 레이어를 투명화
   - 852x1846 학생용 원본 비율과 1586x992 교사용 원본 비율 고정
   ========================================================= */

/* student: remove the white/blur capsules that caused visible seams */
.overlay-field,
.game-round-title,.game-name,.dynamic-score,
.round-result-title,.round-result-score,
.result-score-row,.result-final-value,.final-meta,
.send-state,.copy-link,.linked-room{

  border:none!important;
}

.result-score-row,.result-final-value,.final-meta{padding:0!important}

    <section id="roundResultScreen" class="student-screen hidden">

      <button id="sendBtn" class="overlay-button send-button">선생님께 보내기</button>
      <button id="againBtn" class="overlay-button again-button">다시 도전하기</button>
      <button id="copyBtn" class="copy-link">결과 복사</button>

    <section id="sendCompleteScreen" class="student-screen hidden">
      <img class="plate" src="assets/05_send_complete.png" alt="파스텔 손그림 전송 완료 화면">
      <button id="homeBtn" class="overlay-button home-button">처음으로 돌아가기</button>
    </section>
  </div>

  <div id="teacherApp" class="teacher-app hidden">
    <section class="teacher-stage">
      <img class="teacher-plate" src="assets/06_teacher_dashboard.png" alt="100점에 멈춰라 교사용 실시간 현황판">

      <div class="teacher-overlay teacher-ribbon">교사용 실시간 현황판</div>

      <div class="teacher-room-control" aria-label="활동 코드 열기">
        <input id="teacherRoomCode" type="text" inputmode="numeric" maxlength="6" placeholder="583214" aria-label="활동 코드">

      <div class="teacher-stats">

        <div class="stat"><span>최고 점수</span><strong id="statBest">-</strong></div>

      <div class="teacher-ranking">

          <table id="resultTable" class="hidden">
            <thead><tr><th>순위</th><th>이름</th><th>최종</th><th>1R / 2R / 3R</th><th>제출</th></tr></thead>

        <div class="dist-col"><span class="dist-count" data-dist-count>0</span><div class="dist-bar" data-dist-bar></div><span class="dist-label">21~40</span></div>
        <div class="dist-col"><span class="dist-count" data-dist-count>0</span><div class="dist-bar" data-dist-bar></div><span class="dist-label">41~60</span></div>
        <div class="dist-col"><span class="dist-count" data-dist-count>0</span><div class="dist-bar" data-dist-bar></div><span class="dist-label">61~80</span></div>
        <div class="dist-col"><span class="dist-count" data-dist-count>0</span><div class="dist-bar" data-dist-bar></div><span class="dist-label">81~99</span></div>
        <div class="dist-col"><span class="dist-count" data-dist-count>0</span><div class="dist-bar" data-dist-bar></div><span class="dist-label">100</span></div>

        <div id="connectionState" class="connection">활동 코드를 준비하고 있습니다.</div>
      </div>

      <div class="teacher-share-panel">
        <div id="shareBox" class="share-box"><strong>학생용 주소</strong><br>활동을 열면 링크가 표시됩니다.</div>
        <div class="teacher-room-badge"><span>활동 코드</span><strong id="teacherRoomBadge">------</strong></div>
        <div class="teacher-footer">
          <button id="copyStudentLinkBtn" class="secondary" type="button">학생용 주소 복사</button>
          <button id="closeRoomBtn" class="danger" type="button">활동 종료</button>
        </div>
      </div>
    </section>
  </div>

  <div id="countdown" class="countdown hidden">3</div>
  <div id="toast" class="toast">완료</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      onValue,
      update,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVyzUwr6vZZPngwvgSCU5oCVa3D7lTFrs",
      authDomain: "stop-at-100-game.firebaseapp.com",
      databaseURL: "https://stop-at-100-game-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "stop-at-100-game",
      storageBucket: "stop-at-100-game.firebasestorage.app",
      messagingSenderId: "1019194357738",
      appId: "1:1019194357738:web:37039e91cc474ab1956493"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const TOTAL_ROUNDS = 3;
    const DB_ROOT = "stopAt100_v2";
    const PARTICIPANT_PREFIX = "stopAt100Participant_v2";
    const ROOM_CODE_LENGTH = 6;

    const studentApp = document.getElementById("studentApp");
    const teacherApp = document.getElementById("teacherApp");

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const roundResultScreen = document.getElementById("roundResultScreen");
    const resultScreen = document.getElementById("resultScreen");
    const sendCompleteScreen = document.getElementById("sendCompleteScreen");

    const roomInputWrap = document.getElementById("roomInputWrap");
    const linkedRoomBox = document.getElementById("linkedRoomBox");
    const linkedRoomCode = document.getElementById("linkedRoomCode");
    const roomCodeInput = document.getElementById("roomCode");
    const playerNameInput = document.getElementById("playerName");
    const roomDigitEls = Array.from(document.querySelectorAll("[data-room-digit]"));
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const sendBtn = document.getElementById("sendBtn");
    const copyBtn = document.getElementById("copyBtn");
    const againBtn = document.getElementById("againBtn");

    const gameName = document.getElementById("gameName");
    const roundNow = document.getElementById("roundNow");
    const scoreNumber = document.getElementById("scoreNumber");
    const meterFill = document.getElementById("meterFill");
    const numberBox = document.getElementById("numberBox");
    const countdown = document.getElementById("countdown");
    const toast = document.getElementById("toast");
    const sendState = document.getElementById("sendState");
    const roundResultRound = document.getElementById("roundResultRound");
    const roundResultScore = document.getElementById("roundResultScore");
    const nextRoundBtn = document.getElementById("nextRoundBtn");
    const homeBtn = document.getElementById("homeBtn");

    const mini = [
      document.getElementById("mini1"),
      document.getElementById("mini2"),
      document.getElementById("mini3")
    ];

    const teacherRoomCode = document.getElementById("teacherRoomCode");
    const openRoomBtn = document.getElementById("openRoomBtn");
    const newRoomBtn = document.getElementById("newRoomBtn");
    const copyStudentLinkBtn = document.getElementById("copyStudentLinkBtn");
    const closeRoomBtn = document.getElementById("closeRoomBtn");
    const shareBox = document.getElementById("shareBox");
    const connectionState = document.getElementById("connectionState");
    const statCount = document.getElementById("statCount");
    const statAvg = document.getElementById("statAvg");
    const statBest = document.getElementById("statBest");
    const statPerfect = document.getElementById("statPerfect");
    const resultTable = document.getElementById("resultTable");
    const resultBody = document.getElementById("resultBody");
    const emptyState = document.getElementById("emptyState");
    const distBars = Array.from(document.querySelectorAll("[data-dist-bar]"));
    const distCounts = Array.from(document.querySelectorAll("[data-dist-count]"));

    let playerName = "";
    let roomCode = "";
    let roomFromLink = "";
    let round = 1;
    let scores = [];
    let running = false;
    let currentScore = 0;
    let direction = 1;
    let speed = 0.9;
    let animationId = null;
    let lastTime = 0;
    let currentFinalScore = 0;

    let currentTeacherRoom = "";
    let stopTeacherListener = null;
    let studentShareUrl = "";
    let teacherUser = null;

    function sanitizeRoom(value) {
      return String(value || "")
        .trim()
        .replace(/[^0-9]/g, "")
        .slice(0, ROOM_CODE_LENGTH);
    }

    function normalizeName(value) {
      return String(value || "").trim().replace(/\s+/g, " ").slice(0, 12);
    }

    function updateRoomCodeVisual(value) {
      const cleaned = sanitizeRoom(value);
      roomDigitEls.forEach((el, index) => {
        el.textContent = cleaned[index] || "";
        el.classList.toggle("filled", Boolean(cleaned[index]));
      });
    }

    function randomToken() {
      if (crypto.randomUUID) return crypto.randomUUID().replaceAll("-", "");
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    function simpleNameKey(name) {
      let hash = 2166136261;
      const normalized = normalizeName(name).toLowerCase();
      for (let i = 0; i < normalized.length; i += 1) {
        hash ^= normalized.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }

    function getParticipantIdentity(room, name) {
      const storageKey = `${PARTICIPANT_PREFIX}:${room}:${simpleNameKey(name)}`;
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(storageKey) || "null");
      } catch (_) {
        saved = null;
      }

      if (!saved?.participantId || !saved?.writerKey) {
        saved = {
          participantId: `p_${randomToken()}`,
          writerKey: randomToken()
        };
        localStorage.setItem(storageKey, JSON.stringify(saved));
      }
      return saved;
    }

    function show(screen) {
      [startScreen, gameScreen, roundResultScreen, resultScreen, sendCompleteScreen].forEach(el => el.classList.add("hidden"));
      screen.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function setConnection(text, state = "") {
      connectionState.textContent = text;
      connectionState.classList.remove("good", "warn");
      if (state) connectionState.classList.add(state);
    }

    function resetGame() {
      round = 1;
      scores = [];
      currentScore = 0;
      direction = 1;
      currentFinalScore = 0;
      mini.forEach(el => el.textContent = "-");
      scoreNumber.textContent = "0";
      meterFill.style.width = "0%";
      stopBtn.disabled = false;
      stopBtn.textContent = "멈추기!";
      sendBtn.disabled = false;
      sendBtn.textContent = "선생님께 보내기";
      sendState.textContent = "";
    }

    function startCountdown(callback) {
      let n = 3;
      countdown.textContent = n;
      countdown.classList.remove("hidden");

      const timer = setInterval(() => {
        n -= 1;
        if (n > 0) {
          countdown.textContent = n;
        } else {
          clearInterval(timer);
          countdown.textContent = "시작!";
          setTimeout(() => {
            countdown.classList.add("hidden");
            callback();
          }, 450);
        }
      }, 700);
    }

    function prepareRound() {
      roundNow.textContent = round;
      currentScore = Math.floor(Math.random() * 21);
      direction = 1;
      speed = 0.075 + Math.random() * 0.035 + (round - 1) * 0.014;
      scoreNumber.textContent = Math.round(currentScore);
      meterFill.style.width = `${currentScore}%`;
      stopBtn.disabled = true;
      stopBtn.textContent = "준비";

      startCountdown(() => {
        stopBtn.disabled = false;
        stopBtn.textContent = "멈추기!";
        running = true;
        lastTime = performance.now();
        animationId = requestAnimationFrame(tick);
      });
    }

    function tick(now) {
      if (!running) return;
      const dt = now - lastTime;
      lastTime = now;
      currentScore += direction * speed * dt;

      if (currentScore >= 100) {
        currentScore = 100;
        direction = -1;
      } else if (currentScore <= 0) {
        currentScore = 0;
        direction = 1;
      }

      const displayScore = Math.round(currentScore);
      scoreNumber.textContent = displayScore;
      meterFill.style.width = `${displayScore}%`;
      animationId = requestAnimationFrame(tick);
    }

    function stopRound() {
      if (!running) return;
      running = false;
      cancelAnimationFrame(animationId);
      stopBtn.disabled = true;

      const score = Math.round(currentScore);
      scores.push(score);
      mini[round - 1].textContent = score;
      scoreNumber.textContent = score;
      meterFill.style.width = `${score}%`;

      if (score >= 95) showToast("거의 100점!");
      else if (score >= 80) showToast("좋은 기록!");
      else showToast("다음 라운드!");

      if (round < TOTAL_ROUNDS) {
        roundResultRound.textContent = `${round}라운드 종료!`;
        roundResultScore.textContent = `${score}점`;
        nextRoundBtn.textContent = "다음 라운드";
        show(roundResultScreen);
      } else {
        showResult();
      }
    }

    function getGrade(score) {
      if (score >= 95) return ["전설의 타이밍 장인", "거의 완벽합니다. 오늘의 우승 후보입니다."];
      if (score >= 90) return ["100점 근처 포식자", "아주 훌륭한 기록입니다."];
      if (score >= 80) return ["침착한 승부사", "안정적인 감각이 느껴집니다."];
      if (score >= 70) return ["교무실 순발력자", "좋은 기록입니다. 한끗 차이였습니다."];
      if (score >= 60) return ["타이밍 예열 중", "숫자가 생각보다 빠릅니다."];
      return ["다음 기회의 주인공", "괜찮습니다. 이 게임은 원래 사람을 약 올립니다."];
    }

    function showResult() {
      currentFinalScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
      const [grade, comment] = getGrade(currentFinalScore);

      document.getElementById("resultName").textContent = playerName;
      document.getElementById("finalScore").textContent = currentFinalScore;
      document.getElementById("gradeText").textContent = grade;
      document.getElementById("gradeComment").textContent = comment;
      document.getElementById("r1").textContent = `${scores[0]}점`;
      document.getElementById("r2").textContent = `${scores[1]}점`;
      document.getElementById("r3").textContent = `${scores[2]}점`;
      document.getElementById("avgScore").textContent = `${currentFinalScore}점`;

      sendBtn.disabled = false;
      sendBtn.textContent = "선생님께 보내기";
      sendState.textContent = "";
      show(resultScreen);
    }

    async function readRoomMeta(room) {
      try {
        const snap = await get(ref(db, `${DB_ROOT}/rooms/${room}/meta`));
        return snap.exists() ? snap.val() : null;
      } catch (error) {
        console.error("Room meta read error:", error);
        return null;
      }
    }

    async function startGame() {
      const name = normalizeName(playerNameInput.value);
      const room = sanitizeRoom(roomFromLink || roomCodeInput.value);

      if (room.length !== ROOM_CODE_LENGTH) {
        showToast("6자리 활동 코드를 확인해 주세요.");
        if (!roomFromLink) roomCodeInput.focus();
        return;
      }
      if (!name) {
        showToast("이름을 입력해 주세요.");
        playerNameInput.focus();
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = "확인 중...";
      const meta = await readRoomMeta(room);
      startBtn.disabled = false;
      startBtn.textContent = "게임 시작하기";

      if (!meta) {
        showToast("존재하지 않는 활동 코드입니다.");
        return;
      }
      if (meta.closed === true) {
        showToast("종료된 활동입니다.");
        return;
      }

      roomCode = room;
      playerName = name;
      gameName.textContent = playerName;
      resetGame();
      show(gameScreen);
      prepareRound();
    }

    async function sendResult() {
      if (!roomCode || !playerName || scores.length !== TOTAL_ROUNDS) {
        showToast("보낼 결과가 없습니다.");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "보내는 중...";
      sendState.textContent = "교사 화면으로 전송하고 있습니다.";

      try {
        const meta = await readRoomMeta(roomCode);
        if (!meta || meta.closed === true) throw new Error("ROOM_CLOSED_OR_MISSING");

        const identity = getParticipantIdentity(roomCode, playerName);
        const resultRef = ref(db, `${DB_ROOT}/rooms/${roomCode}/players/${identity.participantId}`);

        await set(resultRef, {
          playerName,
          finalScore: currentFinalScore,
          scores: [...scores],
          submittedAt: serverTimestamp(),
          updatedAtClient: Date.now(),
          writerKey: identity.writerKey,
          version: 2
        });

        sendBtn.textContent = "전송 완료 ✓";
        sendState.textContent = "선생님 화면에 결과가 전송되었습니다.";
        showToast("전송 완료!");
        setTimeout(() => show(sendCompleteScreen), 320);
      } catch (error) {
        console.error("Firebase send error:", error);
        sendBtn.disabled = false;
        sendBtn.textContent = "다시 보내기";
        sendState.textContent = "전송에 실패했습니다. 활동이 종료되었거나 Firebase 규칙을 확인해야 합니다.";
        showToast("전송 실패");
      }
    }

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(successMessage);
      } catch (_) {
        showToast("복사가 되지 않았습니다.");
      }
    }

    function copyResult() {
      const text =
        `[100점에 멈춰라 결과]\n` +
        `활동 코드: ${roomCode}\n` +
        `이름: ${playerName}\n` +
        `최종 점수: ${currentFinalScore}점\n` +
        `라운드: ${scores.join(" / ")}점`;
      copyText(text, "결과가 복사되었습니다.");
    }

    function generateRoomCode() {
      const min = 10 ** (ROOM_CODE_LENGTH - 1);
      const max = (10 ** ROOM_CODE_LENGTH) - 1;
      return String(Math.floor(min + Math.random() * (max - min + 1)));
    }

    async function ensureTeacherAuth() {
      if (auth.currentUser) {
        teacherUser = auth.currentUser;
        return teacherUser;
      }
      const credential = await signInAnonymously(auth);
      teacherUser = credential.user;
      return teacherUser;
    }

    async function createUniqueRoom() {
      const user = await ensureTeacherAuth();
      for (let attempt = 0; attempt < 20; attempt += 1) {
        const code = generateRoomCode();
        const metaRef = ref(db, `${DB_ROOT}/rooms/${code}/meta`);
        const snap = await get(metaRef);
        if (snap.exists()) continue;

        await set(metaRef, {
          ownerUid: user.uid,
          createdAt: serverTimestamp(),
          createdAtClient: Date.now(),
          closed: false,
          version: 2,
          title: "100점에 멈춰라!"
        });
        return code;
      }
      throw new Error("ROOM_CODE_EXHAUSTED");
    }

    function getStudentUrl(room) {
      const url = new URL(window.location.href);
      url.searchParams.delete("teacher");
      url.searchParams.set("room", room);
      return url.toString();
    }

    function formatTime(timestamp) {
      if (!timestamp || !Number.isFinite(timestamp)) return "-";
      try {
        return new Date(timestamp).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      } catch (_) {
        return "-";
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderTeacherResults(playersObj) {
      const rows = Object.entries(playersObj || {})
        .map(([id, data]) => ({
          id,
          playerName: String(data?.playerName || "이름 없음"),
          finalScore: Number(data?.finalScore ?? 0),
          scores: Array.isArray(data?.scores) ? data.scores.map(Number) : [],
          submittedAt: Number(data?.submittedAt || data?.updatedAtClient || 0)
        }))
        .filter(item => Number.isFinite(item.finalScore) && item.scores.length === TOTAL_ROUNDS)
        .sort((a, b) => {
          if (b.finalScore !== a.finalScore) return b.finalScore - a.finalScore;
          return a.submittedAt - b.submittedAt;
        });

      const count = rows.length;
      const avg = count ? Math.round(rows.reduce((sum, r) => sum + r.finalScore, 0) / count) : null;
      const best = count ? rows[0].finalScore : null;
      const perfect = rows.filter(r => r.finalScore === 100).length;
      renderDistribution(rows);

      statCount.textContent = count;
      statAvg.textContent = avg === null ? "-" : avg;
      statBest.textContent = best === null ? "-" : best;
      statPerfect.textContent = perfect;

      if (!count) {
        resultTable.classList.add("hidden");
        emptyState.classList.remove("hidden");
        resultBody.innerHTML = "";
        return;
      }

      emptyState.classList.add("hidden");
      resultTable.classList.remove("hidden");

      let previousScore = null;
      let previousRank = 0;
      resultBody.innerHTML = rows.map((row, index) => {
        const rank = row.finalScore === previousScore ? previousRank : index + 1;
        previousScore = row.finalScore;
        previousRank = rank;
        return `
          <tr>
            <td class="rank">${rank}</td>
            <td>${escapeHtml(row.playerName)}</td>
            <td class="score">${row.finalScore}</td>
            <td>${escapeHtml(row.scores.join(" / "))}</td>
            <td>${formatTime(row.submittedAt)}</td>
          </tr>
        `;
      }).join("");
    }

    function renderDistribution(rows) {
      const bins = [0, 0, 0, 0, 0, 0];
      rows.forEach(row => {
        const s = Number(row.finalScore || 0);
        if (s <= 20) bins[0] += 1;
        else if (s <= 40) bins[1] += 1;
        else if (s <= 60) bins[2] += 1;
        else if (s <= 80) bins[3] += 1;
        else if (s < 100) bins[4] += 1;
        else bins[5] += 1;
      });
      const max = Math.max(1, ...bins);
      distBars.forEach((bar, i) => { bar.style.height = `${Math.max(8, Math.round((bins[i] / max) * 100))}%`; });
      distCounts.forEach((el, i) => { el.textContent = bins[i]; });
    }

    function resetTeacherStats() {
      statCount.textContent = "0";
      statAvg.textContent = "-";
      statBest.textContent = "-";
      statPerfect.textContent = "0";
      resultBody.innerHTML = "";
      resultTable.classList.add("hidden");
      emptyState.classList.remove("hidden");
      renderDistribution([]);
    }

    async function openTeacherRoom(roomValue) {
      const room = sanitizeRoom(roomValue);
      if (room.length !== ROOM_CODE_LENGTH) {
        showToast("6자리 활동 코드를 확인해 주세요.");
        teacherRoomCode.focus();
        return false;
      }

      try {
        const user = await ensureTeacherAuth();
        const meta = await readRoomMeta(room);
        if (!meta) {
          setConnection("존재하지 않는 활동 코드입니다.", "warn");
          resetTeacherStats();
          return false;
        }
        if (meta.ownerUid !== user.uid) {
          setConnection("이 브라우저에서 만든 활동이 아니어서 교사 화면을 열 수 없습니다.", "warn");
          resetTeacherStats();
          return false;
        }

        if (stopTeacherListener) {
          stopTeacherListener();
          stopTeacherListener = null;
        }

        currentTeacherRoom = room;
        teacherRoomCode.value = room;
        const teacherRoomBadge = document.getElementById("teacherRoomBadge");
        if (teacherRoomBadge) teacherRoomBadge.textContent = room;
        studentShareUrl = getStudentUrl(room);

        const url = new URL(window.location.href);
        url.searchParams.set("teacher", "1");
        url.searchParams.set("room", room);
        history.replaceState(null, "", url.toString());

        shareBox.innerHTML =
          `<strong>학생용 주소</strong><br>` +
          `${escapeHtml(studentShareUrl)}`;

        setConnection(meta.closed === true
          ? `활동 코드 ${room} · 종료된 활동`
          : `활동 코드 ${room} · 실시간 결과 수신 중`,
          meta.closed === true ? "warn" : "good"
        );
        closeRoomBtn.disabled = meta.closed === true;
        closeRoomBtn.textContent = meta.closed === true ? "활동 종료됨" : "활동 종료";

        const playersRef = ref(db, `${DB_ROOT}/rooms/${room}/players`);
        stopTeacherListener = onValue(
          playersRef,
          snapshot => renderTeacherResults(snapshot.val()),
          error => {
            console.error("Firebase listen error:", error);
            setConnection("결과 읽기 권한이 없습니다. Firebase 규칙을 확인해 주세요.", "warn");
            showToast("연결 실패");
          }
        );
        return true;
      } catch (error) {
        console.error("Teacher room open error:", error);
        setConnection("교사 인증에 실패했습니다. Firebase 익명 로그인을 확인해 주세요.", "warn");
        showToast("교사 인증 실패");
        return false;
      }
    }

    async function createAndOpenRoom() {
      newRoomBtn.disabled = true;
      newRoomBtn.textContent = "만드는 중...";
      try {
        const code = await createUniqueRoom();
        teacherRoomCode.value = code;
        await openTeacherRoom(code);
        showToast(`새 활동 코드 ${code}`);
      } catch (error) {
        console.error("Room create error:", error);
        setConnection("새 활동을 만들지 못했습니다. Firebase 익명 로그인/규칙을 확인해 주세요.", "warn");
        showToast("새 활동 생성 실패");
      } finally {
        newRoomBtn.disabled = false;
        newRoomBtn.textContent = "새 활동";
      }
    }

    async function closeCurrentRoom() {
      if (!currentTeacherRoom || !teacherUser) {
        showToast("먼저 내 방을 열어 주세요.");
        return;
      }
      if (!confirm(`활동 코드 ${currentTeacherRoom}의 제출을 종료할까요?\n기존 결과는 그대로 남습니다.`)) return;

      try {
        await update(ref(db, `${DB_ROOT}/rooms/${currentTeacherRoom}/meta`), {
          closed: true,
          closedAt: serverTimestamp()
        });
        closeRoomBtn.disabled = true;
        closeRoomBtn.textContent = "활동 종료됨";
        setConnection(`활동 코드 ${currentTeacherRoom} · 종료된 활동`, "warn");
        showToast("활동을 종료했습니다.");
      } catch (error) {
        console.error("Room close error:", error);
        showToast("활동 종료 실패");
      }
    }

    async function initMode() {
      const params = new URLSearchParams(window.location.search);
      const isTeacher = params.get("teacher") === "1";
      const urlRoom = sanitizeRoom(params.get("room"));

      if (isTeacher) {
        document.body.classList.add("teacher-mode");
        studentApp.classList.add("hidden");
        teacherApp.classList.remove("hidden");
        setConnection("교사 인증 확인 중...");

        try {
          await ensureTeacherAuth();
          if (urlRoom.length === ROOM_CODE_LENGTH) {
            const opened = await openTeacherRoom(urlRoom);
            if (!opened) setConnection("내 활동 코드를 입력하거나 새 활동을 만드세요.", "warn");
          } else {
            await createAndOpenRoom();
          }
        } catch (error) {
          console.error("Teacher auth init error:", error);
          setConnection("Firebase Authentication에서 익명 로그인을 먼저 활성화해야 합니다.", "warn");
        }
      } else {
        teacherApp.classList.add("hidden");
        studentApp.classList.remove("hidden");
        roomFromLink = urlRoom.length === ROOM_CODE_LENGTH ? urlRoom : "";

        if (roomFromLink) {
          roomCodeInput.value = roomFromLink;
          roomCodeInput.disabled = true;
          updateRoomCodeVisual(roomFromLink);
          roomInputWrap.classList.remove("hidden");
          linkedRoomCode.textContent = roomFromLink;
          linkedRoomBox.classList.add("hidden");
        } else {
          roomCodeInput.disabled = false;
          roomInputWrap.classList.remove("hidden");
          linkedRoomBox.classList.add("hidden");
          updateRoomCodeVisual(roomCodeInput.value);
        }
      }
    }

    startBtn.addEventListener("click", startGame);
    stopBtn.addEventListener("click", stopRound);
    numberBox.addEventListener("click", stopRound);
    sendBtn.addEventListener("click", sendResult);
    copyBtn.addEventListener("click", copyResult);

    playerNameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") startGame();
    });

    roomCodeInput.addEventListener("keydown", event => {
      if (event.key === "Enter") playerNameInput.focus();
    });

    roomCodeInput.addEventListener("input", event => {
      const cleaned = sanitizeRoom(event.target.value);
      if (event.target.value !== cleaned) event.target.value = cleaned;
      updateRoomCodeVisual(cleaned);
    });

    roomCodeInput.addEventListener("focus", () => updateRoomCodeVisual(roomCodeInput.value));

    againBtn.addEventListener("click", () => {
      running = false;
      cancelAnimationFrame(animationId);
      resetGame();
      playerNameInput.value = playerName || "";
      show(startScreen);
      playerNameInput.focus();
    });

    nextRoundBtn.addEventListener("click", () => {
      if (round >= TOTAL_ROUNDS) return;
      round += 1;
      show(gameScreen);
      prepareRound();
    });

    homeBtn.addEventListener("click", () => {
      running = false;
      cancelAnimationFrame(animationId);
      resetGame();
      playerNameInput.value = playerName || "";
      show(startScreen);
    });

    openRoomBtn.addEventListener("click", () => openTeacherRoom(teacherRoomCode.value));
    teacherRoomCode.addEventListener("keydown", event => {
      if (event.key === "Enter") openTeacherRoom(teacherRoomCode.value);
    });
    newRoomBtn.addEventListener("click", createAndOpenRoom);
    copyStudentLinkBtn.addEventListener("click", () => {
      if (!studentShareUrl) {
        showToast("먼저 내 방을 열어 주세요.");
        return;
      }
      copyText(studentShareUrl, "학생용 주소가 복사되었습니다.");
    });
    closeRoomBtn.addEventListener("click", closeCurrentRoom);

    updateRoomCodeVisual(roomCodeInput.value);
    initMode();
  </script>
</body>
</html>
